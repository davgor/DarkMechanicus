name: Security Audit

on:
  pull_request:
    branches: [main]

jobs:
  audit:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    name: npm audit (fail on moderate+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          set -euo pipefail
          npm audit --json > audit.json || true
          cat audit.json

      - name: Fail on moderate or higher vulnerabilities
        run: |
          python3 - <<'PY'
          import json,sys

          # Advisories with no patched release yet, accepted until one ships. Each reaches only
          # dev tooling (`npm audit --omit=dev` is clean). Remove an entry once a fix is published.
          ACCEPTED = {
              'GHSA-vfj7-8cjw-p6xm': 'braces <= 3.0.3, via ts-prune (deadcode check only)',
              'GHSA-ch52-4w7c-c8xp': 'http-cache-semantics <= 4.2.0, via electron-builder (packaging only)',
          }

          data = json.load(open('audit.json'))
          vulns_obj = data.get('vulnerabilities') or {}
          # Every flagged package traces back to advisory entries in some `via` list; judge those.
          advisories = {}
          for name, info in vulns_obj.items():
              for via in info.get('via') or []:
                  if isinstance(via, dict) and via.get('severity') in ('moderate', 'high', 'critical'):
                      ghsa = (via.get('url') or '').rstrip('/').rsplit('/', 1)[-1] or via.get('title', name)
                      advisories[ghsa] = (name, via.get('title', name), via.get('severity'))

          for ghsa in sorted(set(advisories) & set(ACCEPTED)):
              name, title, severity = advisories[ghsa]
              print(f"::warning::Accepted {ghsa} ({severity}) in {name}: {title}. {ACCEPTED[ghsa]}")
          for ghsa in sorted(set(ACCEPTED) - set(advisories)):
              print(f"::notice::{ghsa} is no longer reported; remove it from ACCEPTED.")

          blocking = {k: v for k, v in advisories.items() if k not in ACCEPTED}
          if blocking:
              print('\nFound vulnerabilities (moderate+):')
              for ghsa, (name, title, severity) in sorted(blocking.items()):
                  print(f"- {name} | {title} | {ghsa} | severity={severity}")
              print('\nAction required: resolve or upgrade affected dependencies before merging.')
              sys.exit(1)
          print('No moderate+ vulnerabilities found')
          PY

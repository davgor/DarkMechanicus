name: CI Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feature/**']

jobs:
  test-shards:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: ['vitest.config.ts', 'fireguard/vitest.config.ts']
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run disjoint Vitest shard
        run: node node_modules/vitest/vitest.mjs run --config ${{ matrix.config }} --shard ${{ matrix.shard }}/2 --maxWorkers 2 --reporter default --reporter json --outputFile "${{ github.workspace }}/test-shard.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-shard-${{ strategy.job-index }}
          path: ${{ github.workspace }}/test-shard.json
          if-no-files-found: error

  test:
    if: ${{ always() && (github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]')) }}
    needs: [test-shards]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test shard
        env:
          SHARD_RESULT: ${{ needs.test-shards.result }}
        run: test "$SHARD_RESULT" = success

  fireguard-scope:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin base ref for every grading job
        id: scope
        run: |
          BASE="${{ github.base_ref || 'main' }}"
          git fetch --no-tags origin "$BASE:refs/remotes/origin/$BASE" || git fetch --no-tags origin "$BASE"
          echo "base=$(git rev-parse "origin/$BASE^{commit}")" >> "$GITHUB_OUTPUT"

  fireguard-shards:
    needs: [fireguard-scope]
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      FIREGUARD_BASE_REF: ${{ needs.fireguard-scope.outputs.base }}
      FIREGUARD_CONCURRENCY: '1'
      VITEST_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Grade disjoint flake runs and production modules
        run: npm run fireguard -- --shard ${{ matrix.shard }}/2 --json-out shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fireguard-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json
          if-no-files-found: error

  fireguard:
    if: ${{ always() && (github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]')) }}
    needs: [fireguard-scope, fireguard-shards]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      FIREGUARD_BASE_REF: ${{ needs.fireguard-scope.outputs.base }}
      FIREGUARD_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: fireguard-shard-*
          path: fireguard-shards
          merge-multiple: true
      - name: Combine raw counts, grade once and update one PR comment
        run: npm run fireguard -- --merge-shards fireguard-shards --shard-count 2 --comment-pr --markdown-out fireguard-pr.md --json-out fireguard-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Require every grading job
        if: always()
        env:
          SCOPE_RESULT: ${{ needs.fireguard-scope.result }}
          SHARD_RESULT: ${{ needs.fireguard-shards.result }}
        run: test "$SCOPE_RESULT" = success && test "$SHARD_RESULT" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fireguard-report
          path: |
            fireguard-pr.md
            fireguard-report.json
          if-no-files-found: error

  lint:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

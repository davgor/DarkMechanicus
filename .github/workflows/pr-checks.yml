name: CI Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feature/**']

jobs:
  shard-plan:
    needs: [fireguard-scope]
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      unit: ${{ steps.plan.outputs.unit }}
      grading: ${{ steps.plan.outputs.grading }}
      grading-count: ${{ steps.plan.outputs.grading_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Plan from CI execution history
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HISTORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Grading history comes only from this pull request's branch (never a fork's): another
          # diff's grading time does not size this one.
          CI_HISTORY_PR_BRANCH: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
          CI_GRADED_DIFF_FILES: ${{ needs.fireguard-scope.outputs.files }}
        run: node scripts/ciShardPlan.mjs > ci-shard-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-shard-plan
          path: ci-shard-plan.json
          if-no-files-found: error

  test-shards:
    name: test-shards (${{ matrix.suite }}, ${{ matrix.index }}/${{ matrix.count }})
    needs: [shard-plan]
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.shard-plan.outputs.unit) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare native installer test compiler
        if: matrix.config == 'vitest.config.ts'
        run: node scripts/prepareInstallerTests.mjs
      - name: Run disjoint Vitest shard
        env:
          TEST_CONFIG: ${{ matrix.config }}
          SHARD_POSITION: ${{ matrix.index }}/${{ matrix.count }}
        run: node node_modules/vitest/vitest.mjs run --config "$env:TEST_CONFIG" --shard "$env:SHARD_POSITION" --maxWorkers 2 --reporter default --reporter json --outputFile "${{ github.workspace }}/test-shard.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-shard-${{ strategy.job-index }}
          path: ${{ github.workspace }}/test-shard.json
          if-no-files-found: error

  test:
    if: ${{ always() && (github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]')) }}
    needs: [shard-plan, test-shards]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test shard
        env:
          PLAN_RESULT: ${{ needs.shard-plan.result }}
          SHARD_RESULT: ${{ needs.test-shards.result }}
        run: test "$PLAN_RESULT" = success && test "$SHARD_RESULT" = success

  fireguard-scope:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.scope.outputs.base }}
      files: ${{ steps.scope.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin base ref for every grading job
        id: scope
        run: |
          BASE="${{ github.base_ref || 'main' }}"
          git fetch --no-tags origin "$BASE:refs/remotes/origin/$BASE" || git fetch --no-tags origin "$BASE"
          BASE_SHA="$(git rev-parse "origin/$BASE^{commit}")"
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          # Files Fireguard can grade (its src, lib and app roots) that the diff adds or changes: the shard floor.
          git diff --name-only --no-renames --diff-filter=AM "$BASE_SHA...HEAD" -- src lib app > graded-diff.txt
          echo "files=$(wc -l < graded-diff.txt)" >> "$GITHUB_OUTPUT"

  fireguard-shards:
    name: fireguard-shards (${{ matrix.index }}/${{ matrix.count }})
    needs: [shard-plan, fireguard-scope]
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.shard-plan.outputs.grading) }}
    env:
      FIREGUARD_BASE_REF: ${{ needs.fireguard-scope.outputs.base }}
      FIREGUARD_CONCURRENCY: '1'
      VITEST_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Grade disjoint flake runs and production modules
        id: grade
        env:
          SHARD_INDEX: ${{ matrix.index }}
          SHARD_POSITION: ${{ matrix.index }}/${{ matrix.count }}
        run: |
          npm run fireguard -- --shard "$SHARD_POSITION" --json-out "shard-$SHARD_INDEX.json"
          node -e 'const { readFileSync, appendFileSync } = require("node:fs");
            const report = JSON.parse(readFileSync(`shard-${process.env.SHARD_INDEX}.json`, "utf8"));
            const flake = report.gates?.flake;
            if (!report.skipped && flake?.pass && flake.runs > 0 && flake.runs === flake.configuredRuns)
              appendFileSync(process.env.GITHUB_OUTPUT, "active=true\n");'
      - name: Record active Fireguard timing sample
        if: steps.grade.outputs.active == 'true' && github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch && github.event.pull_request.head.repo.full_name == github.repository
        run: echo "Completed scoped grading; execution step is eligible as a future timing sample."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fireguard-shard-${{ matrix.index }}
          path: shard-${{ matrix.index }}.json
          if-no-files-found: error

  fireguard:
    if: ${{ always() && (github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]')) }}
    needs: [shard-plan, fireguard-scope, fireguard-shards]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      FIREGUARD_BASE_REF: ${{ needs.fireguard-scope.outputs.base }}
      FIREGUARD_CONCURRENCY: '1'
    steps:
      - name: Require a successful plan and pinned scope
        env:
          PLAN_RESULT: ${{ needs.shard-plan.result }}
          SCOPE_RESULT: ${{ needs.fireguard-scope.result }}
        run: test "$PLAN_RESULT" = success && test "$SCOPE_RESULT" = success
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: fireguard-shard-*
          path: fireguard-shards
          merge-multiple: true
      - name: Combine raw counts, grade once and update one PR comment
        run: npm run fireguard -- --merge-shards fireguard-shards --shard-count "$SHARD_COUNT" --comment-pr --markdown-out fireguard-pr.md --json-out fireguard-report.json
        env:
          SHARD_COUNT: ${{ needs.shard-plan.outputs.grading-count }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Require every grading job
        if: always()
        env:
          SHARD_RESULT: ${{ needs.fireguard-shards.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fireguard-report
          path: |
            fireguard-pr.md
            fireguard-report.json
          if-no-files-found: error

  lint:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Exercise delivery standards in the built desktop
        if: github.event_name == 'pull_request'
        run: node --import tsx scripts/native/deliveryStandardsEvidence.mjs
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: delivery-standards-desktop
          path: out/standards-evidence/*.png
          if-no-files-found: error

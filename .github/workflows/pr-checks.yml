name: CI Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feature/**']

jobs:
  shard-plan:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      unit: ${{ steps.plan.outputs.unit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Plan from CI execution history
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HISTORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/ciShardPlan.mjs > ci-shard-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-shard-plan
          path: ci-shard-plan.json
          if-no-files-found: error

  test-shards:
    name: test-shards (${{ matrix.suite }}, ${{ matrix.index }}/${{ matrix.count }})
    needs: [shard-plan]
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.shard-plan.outputs.unit) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare native installer test compiler
        if: matrix.config == 'vitest.config.ts'
        run: node scripts/prepareInstallerTests.mjs
      - name: Run disjoint Vitest shard
        if: matrix.suite != 'app'
        env:
          TEST_CONFIG: ${{ matrix.config }}
          SHARD_POSITION: ${{ matrix.index }}/${{ matrix.count }}
        run: node node_modules/vitest/vitest.mjs run --config "$env:TEST_CONFIG" --shard "$env:SHARD_POSITION" --maxWorkers 2 --reporter default --reporter json --outputFile "${{ github.workspace }}/test-shard.json"
      # The app shards are the coverage run: each writes its share of coverage into a blob, and the coverage job merges
      # the blobs and judges the vitest.config.ts thresholds once. One shard covers only part of the suite, so the
      # thresholds are off here.
      - name: Run disjoint Vitest shard with coverage
        if: matrix.suite == 'app'
        env:
          TEST_CONFIG: ${{ matrix.config }}
          SHARD_POSITION: ${{ matrix.index }}/${{ matrix.count }}
        run: node node_modules/vitest/vitest.mjs run --config "$env:TEST_CONFIG" --shard "$env:SHARD_POSITION" --maxWorkers 2 --reporter default --reporter json --reporter blob --outputFile.json="${{ github.workspace }}/test-shard.json" --outputFile.blob="${{ github.workspace }}/coverage-blob/blob-${{ matrix.index }}-${{ matrix.count }}.json" --coverage.enabled --coverage.reporter=text-summary --coverage.thresholds.lines=0 --coverage.thresholds.branches=0 --coverage.thresholds.functions=0 --coverage.thresholds.statements=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-shard-${{ strategy.job-index }}
          path: ${{ github.workspace }}/test-shard.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.suite == 'app'
        with:
          name: coverage-blob-${{ strategy.job-index }}
          path: ${{ github.workspace }}/coverage-blob/
          if-no-files-found: error

  coverage:
    if: ${{ always() && (github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]')) }}
    needs: [shard-plan, test-shards]
    # Same OS and workspace path as the shards: the blobs key coverage by absolute Windows source paths.
    runs-on: windows-latest
    steps:
      - name: Require every test shard
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.shard-plan.result }}
          SHARD_RESULT: ${{ needs.test-shards.result }}
        run: test "$PLAN_RESULT" = success && test "$SHARD_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-blob-*
          path: .vitest-reports
          merge-multiple: true
      - name: Merge shard coverage against the vitest.config.ts thresholds
        id: merge
        run: node node_modules/vitest/vitest.mjs run --merge-reports .vitest-reports --coverage.enabled --reporter default
      - name: Publish merged coverage summary
        if: always() && steps.merge.outcome != 'skipped'
        run: node scripts/coverageSummary.mjs --summary coverage/coverage-summary.json --markdown-out "$env:GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.merge.outcome != 'skipped'
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error

  test:
    if: ${{ always() && (github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]')) }}
    needs: [shard-plan, test-shards]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test shard
        env:
          PLAN_RESULT: ${{ needs.shard-plan.result }}
          SHARD_RESULT: ${{ needs.test-shards.result }}
        run: test "$PLAN_RESULT" = success && test "$SHARD_RESULT" = success

  fireguard-scope:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      base: ${{ steps.scope.outputs.base }}
      grading: ${{ steps.plan.outputs.grading }}
      grading-count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # History for the merge base without every blob; git fetches the few it diffs on demand.
          filter: blob:none
      - name: Pin base ref for every grading job
        id: scope
        run: |
          BASE="${{ github.base_ref || 'main' }}"
          git fetch --no-tags origin "$BASE:refs/remotes/origin/$BASE" || git fetch --no-tags origin "$BASE"
          echo "base=$(git rev-parse "origin/$BASE^{commit}")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # One installed node_modules per lockfile, saved here and restored by every grading job instead
      # of each running npm ci (about 14 s apiece on the Fireguard critical path).
      - name: Restore installed dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: fireguard-node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'scripts/ptyHelperMode.mjs', 'scripts/xtermGraphemesPatch.mjs') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      # Sizes the grading matrix from this diff's own work (flake runs, graded test files, mutants
      # on changed lines) so a typical PR grades in about 2 minutes, up to 40 shards. Runs no test.
      # The account starts at most CI_RUNNER_LIMIT jobs at once (a quiet run peaked at 40 with 14
      # grading shards queued, run 46181503154): the plan leaves room for the Vitest shards (the same
      # history plan as shard-plan) plus lint, build and one hand-off job, so no shard waits a wave.
      - name: Plan grading shards from the diff
        id: plan
        env:
          FIREGUARD_BASE_REF: ${{ steps.scope.outputs.base }}
          CI_RUNNER_LIMIT: '40'
          GH_TOKEN: ${{ github.token }}
          CI_HISTORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          UNIT_JOBS="$(GITHUB_OUTPUT= node scripts/ciShardPlan.mjs 2>/dev/null | jq '.unit.include | length')"
          BUDGET=$(( CI_RUNNER_LIMIT - UNIT_JOBS - 3 ))
          if [ "$BUDGET" -lt 1 ]; then BUDGET=1; fi
          npm run --silent fireguard -- --plan --runner-budget "$BUDGET" --json-out fireguard-plan.json
          echo "grading=$(jq -c .matrix fireguard-plan.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(jq .count fireguard-plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: fireguard-plan
          path: fireguard-plan.json
          if-no-files-found: error

  fireguard-shards:
    name: fireguard-shards (${{ matrix.index }}/${{ matrix.count }})
    needs: [fireguard-scope]
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fireguard-scope.outputs.grading) }}
    env:
      FIREGUARD_BASE_REF: ${{ needs.fireguard-scope.outputs.base }}
      # Two lanes (isolated snapshots, one Vitest worker each on the 4-CPU runner) overlap flake runs:
      # a run lasts as long as its slowest graded file, so more workers per run did not help
      # (VITEST_MAX_WORKERS 4: longest grading 78 s vs 79 s, runs 46182438344 and 46182113492).
      FIREGUARD_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore installed dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: fireguard-node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'scripts/ptyHelperMode.mjs', 'scripts/xtermGraphemesPatch.mjs') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - name: Grade disjoint flake runs and production modules
        env:
          SHARD_INDEX: ${{ matrix.index }}
          SHARD_POSITION: ${{ matrix.index }}/${{ matrix.count }}
        run: npm run fireguard -- --shard "$SHARD_POSITION" --json-out "shard-$SHARD_INDEX.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fireguard-shard-${{ matrix.index }}
          path: shard-${{ matrix.index }}.json
          if-no-files-found: error

  fireguard:
    if: ${{ always() && (github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]')) }}
    needs: [fireguard-scope, fireguard-shards]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      FIREGUARD_BASE_REF: ${{ needs.fireguard-scope.outputs.base }}
      FIREGUARD_CONCURRENCY: '1'
    steps:
      - name: Require a pinned scope and grading plan
        env:
          SCOPE_RESULT: ${{ needs.fireguard-scope.result }}
        run: test "$SCOPE_RESULT" = success
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore installed dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: fireguard-node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'scripts/ptyHelperMode.mjs', 'scripts/xtermGraphemesPatch.mjs') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: fireguard-shard-*
          path: fireguard-shards
          merge-multiple: true
      - name: Combine raw counts, grade once and update one PR comment
        run: npm run fireguard -- --merge-shards fireguard-shards --shard-count "$SHARD_COUNT" --comment-pr --markdown-out fireguard-pr.md --json-out fireguard-report.json
        env:
          SHARD_COUNT: ${{ needs.fireguard-scope.outputs.grading-count }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Require every grading job
        if: always()
        env:
          SHARD_RESULT: ${{ needs.fireguard-shards.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fireguard-report
          path: |
            fireguard-pr.md
            fireguard-report.json
          if-no-files-found: error

  lint:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Exercise delivery standards in the built desktop
        if: github.event_name == 'pull_request'
        run: node --import tsx scripts/native/deliveryStandardsEvidence.mjs
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: delivery-standards-desktop
          path: out/standards-evidence/*.png
          if-no-files-found: error
